apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: expense-backend
  template:
    metadata:
      labels:
        app: expense-backend
    spec:
      serviceAccountName: expense-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: expense-backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: expense-backend
        # hostname spread alone doesn't guarantee cross-AZ placement — two nodes can
        # both land in the same zone (this happened in prod: both node groups picked
        # ca-central-1a). Explicit zone spread is what actually buys AZ fault tolerance.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: expense-backend
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: TABLE_NAME
              value: "${TABLE_NAME}"
            - name: AWS_DEFAULT_REGION
              value: "${AWS_DEFAULT_REGION}"
            - name: AWS_REGION
              value: "${AWS_DEFAULT_REGION}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Use GET / — GET /expenses without ?month=YYYY-MM returns 400 from the API (invalid_month).
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: expense-backend
spec:
  selector:
    app: expense-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# minAvailable: 2 (of 3) — at most 1 pod evicted at a time during a voluntary
# disruption (node drain, EKS node group upgrade). Keeps 2/3 capacity online
# instead of dropping to a single pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: expense-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: expense-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: expense-frontend
  template:
    metadata:
      labels:
        app: expense-frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: expense-frontend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: expense-frontend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: expense-frontend
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
        # Sidecar: translates nginx's /nginx_status (plain text) into Prometheus format on
        # :9113/metrics. Shares the pod's network namespace, so localhost reaches the nginx
        # container directly — no Service/DNS needed between the two.
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3
          args:
            - --nginx.scrape-uri=http://localhost:80/nginx_status
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: expense-frontend
  # ServiceMonitor.spec.selector matches labels on THIS Service object, not on
  # spec.selector (which is how the Service finds Pods) — two unrelated fields
  # that happen to share the name "selector". Without this, Prometheus discovers
  # the endpoints but silently drops them (shows up as droppedTargets, not an error).
  labels:
    app: expense-frontend
spec:
  selector:
    app: expense-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: metrics
      port: 9113
      targetPort: 9113
  type: ClusterIP
---
# minAvailable: 2 (of 3) — same reasoning as the backend PDB.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: expense-frontend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: expense-frontend
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: expense-frontend
  labels:
    # kube-prometheus-stack's Prometheus only watches ServiceMonitors carrying this
    # label (its serviceMonitorSelector) — easy to forget, silently scrapes nothing without it.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: expense-frontend
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/security-groups: ${EKS_ALB_SG_ID}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /expenses
            pathType: Prefix
            backend:
              service:
                name: expense-backend
                port:
                  number: 8080
          - path: /months
            pathType: Prefix
            backend:
              service:
                name: expense-backend
                port:
                  number: 8080
          - path: /summary
            pathType: Prefix
            backend:
              service:
                name: expense-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expense-frontend
                port:
                  number: 80
